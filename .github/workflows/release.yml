name: macOS app deploy

on:
  push:
    tags:
      - "macos-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example macos-v0.1.5"
        required: true
        default: "macos-v0.1.5"

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: macos-26-intel
            arch: intel
          - runner: macos-26
            arch: apple-silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Swift package
        run: swift build

      - name: Configure Apple signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE_BASE64" ]]; then
            exit 0
          fi

          keychain_path="$RUNNER_TEMP/metria-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          notary_key_path="$RUNNER_TEMP/notary-key.p8"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -s "$keychain_path"

          printf 'CODESIGN_IDENTITY=%s\n' "$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"

          if [[ -n "$APPLE_NOTARY_KEY_BASE64" ]]; then
            printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$notary_key_path"
            xcrun notarytool store-credentials metria-notary \
              --key "$notary_key_path" \
              --key-id "$APPLE_NOTARY_KEY_ID" \
              --issuer "$APPLE_NOTARY_ISSUER"
            printf 'NOTARY_PROFILE=metria-notary\n' >> "$GITHUB_ENV"
          fi

      - name: Package app
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          SPARKLE_FEED_URL: https://github.com/${{ github.repository }}/releases/download/macos-latest/appcast-${{ matrix.arch }}.xml
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: |
          test -n "$SPARKLE_PUBLIC_ED_KEY"
          [[ "${VERSION#macos-v}" != "$VERSION" ]]
          bash apps/macos-native/scripts/package-macos.sh

      - name: Validate app bundle
        run: |
          test -f dist/Metria.app/Contents/Resources/Assets.car
          test -d dist/Metria.app/Contents/Frameworks/Sparkle.framework
          test -f dist/Metria.app/Contents/Resources/app.css
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' dist/Metria.app/Contents/Info.plist)" = "13.0"
          lipo -archs dist/Metria.app/Contents/MacOS/Metria | grep -qx "$(uname -m)"

      - name: Rename archive
        run: mv "dist/Metria-${{ inputs.version || github.ref_name }}-$(uname -m).zip" "dist/Metria-${{ inputs.version || github.ref_name }}-${{ matrix.arch }}.zip"
      - name: Rename disk image
        run: mv "dist/Metria-${{ inputs.version || github.ref_name }}-$(uname -m).dmg" "dist/Metria-${{ inputs.version || github.ref_name }}-${{ matrix.arch }}.dmg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: Metria-${{ matrix.arch }}
          path: |
            dist/Metria-${{ inputs.version || github.ref_name }}-${{ matrix.arch }}.zip
            dist/Metria-${{ inputs.version || github.ref_name }}-${{ matrix.arch }}.dmg

  publish:
    needs: package
    # Needs an Xcode new enough for `swift build` to know about SwiftUI APIs the app
    # target uses (e.g. onGeometryChange, added to the SDK in Xcode 16) — macos-14
    # runners can default to an older Xcode that predates it and fail this step with
    # "has no member", even though the API is annotated back to macOS 13. Match the
    # `package` job's runner so both jobs build against the same, current toolchain.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: Metria-*
          merge-multiple: true

      - name: Generate signed appcast
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_ED_KEY"
          swift build
          sparkle_bin=".build/artifacts/sparkle/Sparkle/bin/generate_appcast"
          sign_bin=".build/artifacts/sparkle/Sparkle/bin/sign_update"
          tag="${{ inputs.version || github.ref_name }}"
          # generate_appcast rejects multiple archives that share one bundle version, so
          # each architecture gets its own appcast feed (matching its build-time SUFeedURL).
          for arch in intel apple-silicon; do
            rm -rf "appcast/$arch"
            mkdir -p "appcast/$arch"
            cp "dist/Metria-$tag-$arch.zip" "appcast/$arch/"
            printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | "$sparkle_bin" \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/$tag/" \
              --link "https://github.com/${{ github.repository }}" \
              "appcast/$arch"
            # generate_appcast's output filename isn't always "appcast.xml", so
            # pick up whatever single feed file it actually wrote.
            feed="$(find "appcast/$arch" -maxdepth 1 -name '*.xml')"
            test -n "$feed"
            # generate_appcast silently skips signing when the key is piped via
            # --ed-key-file -, so sign the feed explicitly with sign_update instead.
            printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | "$sign_bin" --ed-key-file - "$feed"
            grep -q "sparkle-signatures" "$feed"
            cp "$feed" "dist/appcast-$arch.xml"
          done
          # Builds through v0.1.10 all shipped with the same hardcoded SUFeedURL
          # (a single "appcast.xml", not the arch-specific files above). Keep
          # publishing that legacy name pointed at the Intel feed - historically
          # the only one that ever validated - so those installs do not get
          # stuck permanently unable to auto-update.
          cp "dist/appcast-intel.xml" "dist/appcast.xml"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.version || github.ref_name }}"
          [[ "$tag" == macos-v* ]]
          assets="dist/*.zip dist/*.dmg dist/appcast-intel.xml dist/appcast-apple-silicon.xml dist/appcast.xml"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $assets --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" $assets --generate-notes --repo "${{ github.repository }}"
          fi

          channel_assets="dist/appcast-intel.xml dist/appcast-apple-silicon.xml"
          if gh release view macos-latest >/dev/null 2>&1; then
            gh release upload macos-latest $channel_assets --clobber --repo "${{ github.repository }}"
          else
            gh release create macos-latest $channel_assets --title "macOS latest" --notes "Native macOS update channel." --repo "${{ github.repository }}"
          fi
